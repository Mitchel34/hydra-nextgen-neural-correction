[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-nextgen-neural-correction"
version = "0.1.0"
description = "Curated HYDRA neural correction research kernels and evaluation contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
outlet = ["mlx==0.32.2", "numpy==2.5.3"]

[project.scripts]
hydra-correctors = "hydra_correctors.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hydra_correctors.outlet" = ["licenses/*.txt"]
